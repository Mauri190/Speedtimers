<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTimer — Algoritmos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.cubing.net/js/cubing/twisty" type="module"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --accent:  #f59e0b;
            --algo:    #8b5cf6;
            --panel:   rgba(15,23,42,0.88);
            --card:    rgba(20,30,55,0.9);
            --border:  rgba(59,130,246,0.35);
        }
        *{box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{
            font-family:'Roboto',sans-serif;
            background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
            color:#f1f5f9;min-height:100vh;margin:0;padding:0;overflow-x:hidden;
        }
        .logo-icon{width:32px;height:32px;flex-shrink:0;background:conic-gradient(#e53935 0deg 90deg,#f5f5f5 90deg 180deg,#1565c0 180deg 270deg,#f9a825 270deg 360deg);border:2px solid #333;border-radius:4px;transform:rotate(-15deg);}
        .logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.25rem;background:linear-gradient(to right,#3b82f6,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;}
        .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(8px);}
        .btn-algo{background:#8b5cf6;transition:all .3s;}
        .btn-algo:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(139,92,246,.4);}
        .btn-train{background:#f59e0b;transition:all .3s;}
        .btn-train:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(245,158,11,.4);}
        .btn-primary{background:#3b82f6;transition:all .3s;}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(59,130,246,.4);}
        .dd-menu{background:rgba(10,18,40,.97);border:1px solid var(--primary);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);}
        .dd-menu a:hover{background:rgba(59,130,246,.2);}
        .view{display:none;}
        .view.active{display:block;}

        /* ── CATEGORY GRID */
        .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;}
        .cat-card{background:var(--card);border:1px solid rgba(71,85,105,.5);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden;}
        .cat-card::before{content:'';position:absolute;inset:0;border-radius:14px;opacity:0;background:radial-gradient(circle at center,rgba(59,130,246,.15),transparent 70%);transition:opacity .3s;}
        .cat-card:hover{transform:translateY(-8px);border-color:var(--primary);box-shadow:0 14px 30px rgba(0,0,0,.5);}
        .cat-card:hover::before{opacity:1;}
        .cat-card h3{font-size:.9rem;font-weight:600;color:#e2e8f0;margin:0 0 4px;}
        .cat-sub{font-size:.68rem;color:#64748b;}
        .cat-count{font-size:.67rem;color:#f59e0b;margin-top:4px;}

        /* ── CUBE TWISTY ICON */
        .cube-icon-wrap{
            width:90px;height:90px;margin:0 auto 10px;
            display:flex;align-items:center;justify-content:center;
            position:relative;
        }
        .cube-icon-wrap twisty-player{
            width:90px !important;
            height:90px !important;
            pointer-events:none;
        }

        /* ── METHODS */
        .method-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(30,41,59,.9);border:1px solid rgba(71,85,105,.6);padding:10px 18px;margin:6px;border-radius:999px;cursor:pointer;font-size:.84rem;color:#cbd5e1;transition:all .2s;}
        .method-pill:hover{background:var(--primary);border-color:var(--primary);color:white;}
        .method-pill.active{background:var(--algo);border-color:var(--algo);color:white;}

        /* ── ALGO GRID */
        .algo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
        .algo-card{background:rgba(15,23,42,.75);border:1px solid rgba(71,85,105,.4);border-radius:12px;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;}
        .algo-card:hover{border-color:var(--primary);box-shadow:0 8px 24px rgba(0,0,0,.4);transform:translateY(-3px);}
        .algo-card-head{background:rgba(20,30,58,.8);border-bottom:1px solid rgba(71,85,105,.3);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
        .algo-case-name{font-size:.8rem;font-weight:600;color:#e2e8f0;flex:1;}
        .algo-section-tag{font-size:.65rem;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.35);color:#c4b5fd;border-radius:999px;padding:2px 8px;white-space:nowrap;}
        .algo-card-body{display:flex;flex-direction:row;flex:1;}
        .algo-twisty-col{width:130px;flex-shrink:0;background:rgba(10,16,35,.5);border-right:1px solid rgba(71,85,105,.3);display:flex;align-items:center;justify-content:center;padding:8px;}
        twisty-player{width:114px !important;height:114px !important;}
        .algo-info-col{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
        .algo-moves-box{background:rgba(0,0,0,.3);border:1px solid rgba(71,85,105,.3);border-radius:6px;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#38bdf8;line-height:1.5;word-break:break-all;}
        .algo-moves-box.none-alg{color:#64748b;font-style:italic;}
        .algo-tip{font-size:.72rem;color:#94a3b8;line-height:1.4;}
        .algo-actions{display:flex;gap:6px;margin-top:auto;}
        .btn-copy,.btn-detail{border:1px solid rgba(71,85,105,.5);border-radius:6px;padding:5px 10px;font-size:.72rem;cursor:pointer;transition:all .2s;background:rgba(30,41,59,.6);color:#94a3b8;display:flex;align-items:center;gap:5px;}
        .btn-copy:hover{background:var(--primary);border-color:var(--primary);color:white;}
        .btn-detail:hover{background:#10b981;border-color:#10b981;color:white;}
        .btn-copy.copied{background:#10b981;border-color:#10b981;color:white;}
        .section-header{display:flex;align-items:center;gap:10px;margin:20px 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(71,85,105,.4);}
        .section-header h4{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f59e0b;margin:0;}
        .section-count{font-size:.68rem;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fcd34d;border-radius:999px;padding:2px 8px;}
        .search-box{background:rgba(15,23,42,.85);border:1px solid rgba(71,85,105,.6);border-radius:8px;color:#f1f5f9;padding:10px 16px;font-size:.9rem;outline:none;transition:border-color .2s;width:100%;}
        .search-box:focus{border-color:var(--primary);}
        .search-box::placeholder{color:#475569;}
        .bc{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#64748b;margin-bottom:16px;}
        .bc a{color:var(--primary);cursor:pointer;}
        .bc a:hover{text-decoration:underline;}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(30,41,59,.8);border:1px solid rgba(71,85,105,.5);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.82rem;color:#cbd5e1;transition:all .2s;margin-bottom:16px;}
        .back-btn:hover{background:var(--primary);border-color:var(--primary);color:white;}
        mark{background:rgba(245,158,11,.35);color:#fcd34d;border-radius:2px;padding:0 2px;}

        /* ── TOAST */
        #toast{position:fixed;bottom:24px;right:24px;z-index:999;background:#10b981;color:white;padding:10px 18px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;}
        #toast.show{opacity:1;}

        /* ── MODAL */
        #modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;align-items:center;justify-content:center;padding:16px;}
        #modal-overlay.open{display:flex;}
        #modal-box{background:#0d1a30;border:1px solid var(--primary);border-radius:16px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:24px;position:relative;}
        #modal-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:#64748b;font-size:1.2rem;cursor:pointer;transition:color .2s;}
        #modal-close:hover{color:white;}
        .modal-twisty-wrap{display:flex;justify-content:center;margin-bottom:16px;}
        #modal-twisty{width:220px !important;height:220px !important;}
        .tag-chip{font-size:.62rem;border-radius:999px;padding:2px 7px;border:1px solid;}
        .tag-blue{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.35);color:#7dd3fc;}
        .tag-amber{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.35);color:#fcd34d;}
        .tag-green{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.35);color:#6ee7b7;}
        .tag-rose{background:rgba(236,72,153,.15);border-color:rgba(236,72,153,.35);color:#f9a8d4;}

        /* ── RESPONSIVE */
        @media(max-width:640px){
            .cat-grid{grid-template-columns:repeat(2,1fr);}
            .algo-grid{grid-template-columns:1fr;}
            .algo-twisty-col{width:110px;}
            twisty-player{width:96px !important;height:96px !important;}
        }
        @media(max-width:440px){
            .algo-card-body{flex-direction:column;}
            .algo-twisty-col{width:100%;border-right:none;border-bottom:1px solid rgba(71,85,105,.3);}
            twisty-player{width:130px !important;height:130px !important;}
        }
    </style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// HELPERS cubing.js
// ═══════════════════════════════════════════════════════════
function isNoAlg(moves){
    if(!moves) return true;
    const m=moves.trim();
    return m==='—'||m.startsWith('Sin')||m.startsWith('Intuit')||m.startsWith('Construc')||m.startsWith('Skip')||m.startsWith('Varía')||m.startsWith('Solo')||m.startsWith('Uso')||m.startsWith('x2')||m.startsWith('UR')||m.startsWith('UL')||m.startsWith('DR')||m.startsWith('DL')||m.startsWith('Todos')||m.startsWith('Rotar')||m.startsWith('Repetir')||m.startsWith('Mismo');
}

function makeTwistyEl(alg, puzzle, size){
    const tp=document.createElement('twisty-player');
    tp.setAttribute('puzzle', puzzle||'3x3x3');
    tp.setAttribute('alg', alg);
    tp.setAttribute('experimental-setup-anchor','end');
    tp.setAttribute('background','none');
    tp.setAttribute('control-panel','none');
    tp.setAttribute('hint-facelets','floating');
    tp.style.cssText=`width:${size}px;height:${size}px;`;
    return tp;
}

function makeCategoryTwisty(puzzle, alg, size){
    const tp=document.createElement('twisty-player');
    tp.setAttribute('puzzle', puzzle||'3x3x3');
    if(alg) tp.setAttribute('alg', alg);
    tp.setAttribute('background','none');
    tp.setAttribute('control-panel','none');
    tp.setAttribute('hint-facelets','none');
    tp.setAttribute('visualization','3D');
    tp.style.cssText=`width:${size}px;height:${size}px;pointer-events:none;`;
    return tp;
}

function noVizDiv(size){
    const d=document.createElement('div');
    d.style.cssText=`width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#475569;font-size:.68rem;text-align:center;`;
    d.innerHTML='<i class="fas fa-infinity" style="font-size:1.5rem"></i>Intuitivo';
    return d;
}

      puzzle:"clock",
      sections:{
        "Hansen setup":[
          {name:"Setup pines óptimo",    moves:"Usar pins UR+DL para la mayoria"},
          {name:"Paso 1 — UR+DL up",     moves:"UR+DL pins up"},
          {name:"Paso 2 — Ajuste cruz",  moves:"Girar hasta que marcadores coincidan"},
          {name:"Paso 3 — flip+adjust",  moves:"Flip y ajustar cara trasera"},
        ],
      }
    },
  }
},

}; // fin DB

// ═══════════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════════
let curCat=null, curMethod=null, modalAlg=null, modalPuzzle='3x3x3';

// ═══════════════════════════════════════════════════════════
// CONTEO
// ═══════════════════════════════════════════════════════════
function countAlgos(cat){
    let n=0;
    Object.values(DB[cat].methods).forEach(m=>{Object.values(m.sections).forEach(s=>{n+=s.length;});});
    return n;
}

// ═══════════════════════════════════════════════════════════
// RENDER GRID — cubos reales con twisty-player
// ═══════════════════════════════════════════════════════════
function buildGrid(){
    const grid=document.getElementById('cat-grid');
    grid.innerHTML='';
    ['3x3','2x2','4x4','5x5','oh','bld','mega','pyra','skewb','sq1','clock'].forEach(k=>{
        const d=DB[k]; if(!d) return;
        const card=document.createElement('div');
        card.className='cat-card';
        card.onclick=()=>showMethods(k);

        // Cubo real con twisty-player
        const iconWrap=document.createElement('div');
        iconWrap.className='cube-icon-wrap';
        const puzz=d.puzzle||'3x3x3';
        const alg=d.iconAlg||'';
        const tp=document.createElement('twisty-player');
        tp.setAttribute('puzzle', puzz);
        if(alg) tp.setAttribute('alg', alg);
        tp.setAttribute('background','none');
        tp.setAttribute('control-panel','none');
        tp.setAttribute('hint-facelets','none');
        tp.setAttribute('visualization','3D');
        tp.style.cssText='width:90px;height:90px;pointer-events:none;';
        iconWrap.appendChild(tp);

        card.appendChild(iconWrap);

        const title=document.createElement('h3');
        title.textContent=d.label;
        card.appendChild(title);

        const sub=document.createElement('div');
        sub.className='cat-sub';
        sub.textContent=d.sub;
        card.appendChild(sub);

        const count=document.createElement('div');
        count.className='cat-count';
        count.textContent=countAlgos(k)+' algoritmos';
        card.appendChild(count);

        grid.appendChild(card);
    });
}

// ═══════════════════════════════════════════════════════════
// VIEWS
// ═══════════════════════════════════════════════════════════
function setView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}

function goCats(){curCat=null;curMethod=null;setView('v-cats');document.getElementById('search-panel').classList.add('hidden');document.getElementById('global-search').value='';}

function showMethods(catKey){
    curCat=catKey;
    const d=DB[catKey];
    document.getElementById('bc1').textContent=d.label;
    document.getElementById('m-title').textContent=d.label;
    document.getElementById('m-desc').textContent='Selecciona un método para ver los algoritmos con visualización 3D animada.';
    const list=document.getElementById('m-list');
    list.innerHTML='';
    Object.keys(d.methods).forEach(mName=>{
        const n=Object.values(d.methods[mName].sections).reduce((a,s)=>a+s.length,0);
        const pill=document.createElement('button');
        pill.className='method-pill';
        pill.innerHTML=`<i class="fas fa-layer-group text-xs"></i>${mName} <span style="font-size:.65rem;opacity:.55;margin-left:4px">(${n})</span>`;
        pill.onclick=()=>{document.querySelectorAll('.method-pill').forEach(p=>p.classList.remove('active'));pill.classList.add('active');showAlgos(mName);};
        list.appendChild(pill);
    });
    setView('v-methods');
}

function goMethods(){if(curCat) showMethods(curCat);}

function showAlgos(mName){
    curMethod=mName;
    const m=DB[curCat].methods[mName];
    document.getElementById('bc2').textContent=DB[curCat].label;
    document.getElementById('bc3').textContent=mName;
    document.getElementById('a-title').textContent=mName;
    document.getElementById('a-desc').textContent=m.desc||'';
    renderAlgos(m.sections, m.puzzle||'3x3x3','');
    document.getElementById('algo-search').value='';
    setView('v-algos');
}

function renderAlgos(sections, puzz, filter){
    const cont=document.getElementById('a-content');
    cont.innerHTML='';
    let total=0;
    Object.entries(sections).forEach(([secName,items])=>{
        const filtered=items.filter(a=>!filter||a.name.toLowerCase().includes(filter)||a.moves.toLowerCase().includes(filter));
        if(!filtered.length) return;
        total+=filtered.length;
        const wrap=document.createElement('div');
        const hdr=document.createElement('div');
        hdr.className='section-header';
        hdr.innerHTML=`<h4><i class="fas fa-chevron-right text-xs mr-1"></i>${hl(secName,filter)}</h4><span class="section-count">${filtered.length}</span>`;
        wrap.appendChild(hdr);
        const grid=document.createElement('div');
        grid.className='algo-grid';
        filtered.forEach(a=>grid.appendChild(buildCard(a,secName,puzz,filter)));
        wrap.appendChild(grid);
        cont.appendChild(wrap);
    });
    if(!total) cont.innerHTML=`<div class="text-slate-500 text-center py-12"><i class="fas fa-search text-3xl mb-3 block"></i>Sin resultados para "<strong class="text-white">${filter}</strong>"</div>`;
}

function buildCard(algo, secName, puzz, filter){
    const none=isNoAlg(algo.moves);
    const card=document.createElement('div');
    card.className='algo-card';

    // Head
    const head=document.createElement('div');
    head.className='algo-card-head';
    head.innerHTML=`<span class="algo-case-name">${hl(algo.name,filter)}</span><span class="algo-section-tag">${secName.split('—')[0].trim().substring(0,20)}</span>`;
    card.appendChild(head);

    // Body
    const body=document.createElement('div');
    body.className='algo-card-body';

    // Twisty column
    const tcol=document.createElement('div');
    tcol.className='algo-twisty-col';
    if(!none){
        const tp=makeTwistyEl(algo.moves, puzz, 114);
        tcol.appendChild(tp);
    } else {
        tcol.appendChild(noVizDiv(114));
    }
    body.appendChild(tcol);

    // Info column
    const icol=document.createElement('div');
    icol.className='algo-info-col';
    const mbox=document.createElement('div');
    mbox.className='algo-moves-box'+(none?' none-alg':'');
    mbox.innerHTML=none?'Intuitivo / sin algoritmo fijo':hl(algo.moves,filter);
    icol.appendChild(mbox);
    if(algo.tip){const t=document.createElement('div');t.className='algo-tip';t.innerHTML=`<i class="fas fa-lightbulb text-yellow-400 mr-1"></i>${algo.tip}`;icol.appendChild(t);}
    const actions=document.createElement('div');
    actions.className='algo-actions';
    if(!none){
        const cb=document.createElement('button');cb.className='btn-copy';cb.innerHTML='<i class="fas fa-copy"></i>Copiar';cb.onclick=e=>{e.stopPropagation();copyAlg(cb,algo.moves);};
        const db=document.createElement('button');db.className='btn-detail';db.innerHTML='<i class="fas fa-expand-alt"></i>Detalle';db.onclick=e=>{e.stopPropagation();openModal(algo,secName,puzz);};
        actions.appendChild(cb);actions.appendChild(db);
    }
    icol.appendChild(actions);
    body.appendChild(icol);
    card.appendChild(body);
    return card;
}

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
function openModal(algo, secName, puzz){
    modalAlg=algo.moves; modalPuzzle=puzz||'3x3x3';
    document.getElementById('modal-name').textContent=algo.name;
    document.getElementById('modal-section').textContent=`${DB[curCat].label} › ${curMethod} › ${secName}`;
    document.getElementById('modal-moves').textContent=algo.moves;
    const tipEl=document.getElementById('modal-tip');
    if(algo.tip){tipEl.classList.remove('hidden');tipEl.innerHTML=`<i class="fas fa-lightbulb text-yellow-400 mr-1"></i>${algo.tip}`;}
    else tipEl.classList.add('hidden');
    document.getElementById('modal-tags').innerHTML=`
        <span class="tag-chip tag-blue">${DB[curCat].label}</span>
        <span class="tag-chip tag-amber">${curMethod}</span>
        <span class="tag-chip tag-green">${secName}</span>
    `;
    const mt=document.getElementById('modal-twisty');
    mt.setAttribute('puzzle', puzz||'3x3x3');
    mt.setAttribute('alg', algo.moves);
    mt.setAttribute('experimental-setup-anchor','end');
    mt.setAttribute('background','none');
    mt.setAttribute('control-panel','bottom-row');
    mt.setAttribute('hint-facelets','floating');
    document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function copyModal(){if(modalAlg) copyAlg(null,modalAlg);}

// ═══════════════════════════════════════════════════════════
// BÚSQUEDA GLOBAL
// ═══════════════════════════════════════════════════════════
document.getElementById('global-search').addEventListener('input',function(){
    const q=this.value.trim().toLowerCase();
    const panel=document.getElementById('search-panel');
    if(!q){panel.classList.add('hidden');panel.innerHTML='';return;}
    const res=[];
    Object.entries(DB).forEach(([ck,cat])=>{Object.entries(cat.methods).forEach(([mn,m])=>{Object.entries(m.sections).forEach(([sn,items])=>{items.forEach(a=>{if(a.name.toLowerCase().includes(q)||a.moves.toLowerCase().includes(q)){res.push({ck,cat,mn,m,sn,a});}});});});});
    panel.classList.remove('hidden');panel.innerHTML='';
    if(!res.length){panel.innerHTML=`<div class="panel p-4 text-slate-500 text-center"><i class="fas fa-search mr-2"></i>Sin resultados para "<strong class="text-white">${q}</strong>".</div>`;return;}
    const wrap=document.createElement('div');wrap.className='panel p-4 mb-4';
    const info=document.createElement('div');info.className='text-sm text-slate-400 mb-4';
    info.innerHTML=`<i class="fas fa-search mr-1"></i><strong>${res.length}</strong> resultado(s) para "<strong style="color:white">${q}</strong>"`;
    wrap.appendChild(info);
    const grid=document.createElement('div');grid.className='algo-grid';
    res.slice(0,24).forEach(r=>{
        // store curCat/curMethod temporarily for modal
        const savedCat=curCat, savedMethod=curMethod;
        curCat=r.ck; curMethod=r.mn;
        const card=buildCard(r.a,r.sn,r.m.puzzle||'3x3x3',q);
        curCat=savedCat; curMethod=savedMethod;
        grid.appendChild(card);
    });
    wrap.appendChild(grid);
    if(res.length>24){const m=document.createElement('div');m.className='text-xs text-slate-500 mt-3 text-center';m.textContent=`Mostrando 24 de ${res.length}. Afina la búsqueda.`;wrap.appendChild(m);}
    panel.appendChild(wrap);
});

document.getElementById('algo-search').addEventListener('input',function(){
    if(!curCat||!curMethod) return;
    const m=DB[curCat].methods[curMethod];
    renderAlgos(m.sections,m.puzzle||'3x3x3',this.value.trim().toLowerCase());
});

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function hl(t,f){if(!f) return String(t);const re=new RegExp(`(${f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');return String(t).replace(re,'<mark>$1</mark>');}

function copyAlg(btn,moves){
    navigator.clipboard.writeText(moves).then(()=>{
        if(btn){btn.innerHTML='<i class="fas fa-check"></i>Copiado';btn.classList.add('copied');setTimeout(()=>{btn.innerHTML='<i class="fas fa-copy"></i>Copiar';btn.classList.remove('copied');},1600);}
        toast('Copiado: '+moves.slice(0,40)+(moves.length>40?'…':''));
    });
}

function toast(msg){const el=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}

// ─ Dropdowns
document.querySelectorAll('.dd-wrap').forEach(dd=>{
    const btn=dd.querySelector('button'),menu=dd.querySelector('.dd-menu');
    if(!btn||!menu) return;
    btn.addEventListener('click',e=>{e.stopPropagation();const open=!menu.classList.contains('hidden');document.querySelectorAll('.dd-menu').forEach(m=>m.classList.add('hidden'));if(!open) menu.classList.remove('hidden');});
});
document.addEventListener('click',()=>document.querySelectorAll('.dd-menu').forEach(m=>m.classList.add('hidden')));

// ─ Modal shortcuts
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay')) closeModal();});

// ─ Init
buildGrid();
</script>
</body>
</html>
