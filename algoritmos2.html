<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmos - Speedcubing Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00adb5;
            --text-color: #eeeeee;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Grid de Categorías --- */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* --- Animación Cubo 3D --- */
        .cube-container {
            width: 80px;
            height: 80px;
            perspective: 400px;
            margin: 0 auto 20px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s infinite linear;
        }

        @keyframes rotateCube {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }

        .face {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid #000;
            opacity: 0.9;
        }

        .front  { background: #d50000; transform: translateZ(40px); }
        .back   { background: #ff6d00; transform: rotateY(180deg) translateZ(40px); }
        .right  { background: #2962ff; transform: rotateY(90deg) translateZ(40px); }
        .left   { background: #00c853; transform: rotateY(-90deg) translateZ(40px); }
        .top    { background: #ffffff; transform: rotateX(90deg) translateZ(40px); }
        .bottom { background: #ffd600; transform: rotateX(-90deg) translateZ(40px); }

        /* --- Vistas de Métodos y Algos --- */
        .hidden { display: none; }

        .btn-back {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .methods-container, .algos-display {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .method-item {
            display: inline-block;
            background: #333;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .method-item:hover {
            background: var(--accent-color);
        }

        code {
            background: #000;
            padding: 5px 10px;
            border-radius: 4px;
            color: #00ffcc;
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .algo-card {
            border-bottom: 1px solid #444;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Librería de Algoritmos</h1>
            <p>Selecciona una categoría para empezar</p>
        </header>

        <div id="view-categories" class="categories-grid">
            <div class="card" onclick="showMethods('3x3')">
                <div class="cube-container">
                    <div class="cube">
                        <div class="face front"></div><div class="face back"></div>
                        <div class="face right"></div><div class="face left"></div>
                        <div class="face top"></div><div class="face bottom"></div>
                    </div>
                </div>
                <h3>Cubo 3x3</h3>
            </div>

            <div class="card" onclick="showMethods('2x2')">
                <div class="cube-container"><span>🧊</span></div>
                <h3>Cubo 2x2</h3>
            </div>

            <div class="card" onclick="showMethods('4x4_7x7')">
                <div class="cube-container"><span>📦</span></div>
                <h3>Big Cubes (4-7)</h3>
            </div>

            <div class="card" onclick="showMethods('megaminx')">
                <div class="cube-container"><span>✨</span></div>
                <h3>Megaminx</h3>
            </div>

            <div class="card" onclick="showMethods('pyraminx')">
                <div class="cube-container"><span>🔺</span></div>
                <h3>Pyraminx</h3>
            </div>

            <div class="card" onclick="showMethods('oh')">
                <div class="cube-container"><span>✋</span></div>
                <h3>One Handed (OH)</h3>
            </div>

            <div class="card" onclick="showMethods('blind')">
                <div class="cube-container"><span>🙈</span></div>
                <h3>Blindfolded (BLD)</h3>
            </div>
        </div>

        <div id="view-methods" class="hidden">
            <button class="btn-back" onclick="goBack('view-categories')">← Volver a Categorías</button>
            <h2 id="method-title">Métodos disponibles</h2>
            <div id="methods-list" class="methods-container"></div>
        </div>

        <div id="view-algos" class="hidden">
            <button class="btn-back" onclick="goBack('view-methods')">← Volver a Métodos</button>
            <h2 id="algo-title">Algoritmos</h2>
            <div id="algos-list" class="algos-display"></div>
        </div>
    </div>

    <script>
        // Base de Datos de Algoritmos
        const database = {
            "3x3": {
                "CFOP (Fridrich)": {
                    "F2L (Ejemplo)": ["R U R' U'", "U R U' R'", "y L' U' L"],
                    "OLL (Cruz)": ["F R U R' U' F'", "f R U R' U' f'"],
                    "PLL (Permutaciones)": ["T-Perm: R U R' U' R' F R2 U' R' U' R U R' F'", "Y-Perm: F R U' R' U' R U R' F' R U R' U' R' F R F'"]
                },
                "Roux": {
                    "CMLL": ["R U R' U' R' F R F'", "U2 R U2 R' U' R U' R'"]
                }
            },
            "oh": {
                "Mano Derecha (R-Hand)": {
                    "PLL": ["T-Perm OH: R U R' U' R' F R2 U' R' U' R U R' F'", "Sune: R U R' U R U2 R'"]
                },
                "Mano Izquierda (L-Hand)": {
                    "PLL": ["U-Perm: L' U L' U' L' U' L' U L U L2"]
                }
            },
            "blind": {
                "Old Pochmann": {
                    "Esquinas": ["T-Perm (Target A/D)", "Y-Perm (Target B)"],
                    "Aristas": ["J-Perm", "T-Perm"]
                },
                "M2": {
                    "Aristas": ["M2", "U2 M' U2 M'"]
                }
            },
            "pyraminx": {
                "Layer by Layer": {
                    "Last Layer": ["R U R' U R U R'", "L' U' L U' L' U' L"]
                }
            }
            // Puedes seguir agregando 2x2, 4x4, Megaminx, etc.
        };

        let currentCategory = "";

        function showMethods(cat) {
            currentCategory = cat;
            document.getElementById('view-categories').classList.add('hidden');
            document.getElementById('view-methods').classList.remove('hidden');
            
            const list = document.getElementById('methods-list');
            list.innerHTML = "";
            
            const categoryData = database[cat];
            if(!categoryData) {
                list.innerHTML = "<p>Próximamente más algoritmos para esta categoría...</p>";
                return;
            }

            Object.keys(categoryData).forEach(method => {
                const div = document.createElement('div');
                div.className = "method-item";
                div.innerText = method;
                div.onclick = () => showAlgos(method);
                list.appendChild(div);
            });
        }

        function showAlgos(method) {
            document.getElementById('view-methods').classList.add('hidden');
            document.getElementById('view-algos').classList.remove('hidden');
            
            const list = document.getElementById('algos-list');
            list.innerHTML = "";
            
            const algos = database[currentCategory][method];
            
            for (let section in algos) {
                let sectionHTML = `<h3>${section}</h3>`;
                algos[section].forEach(a => {
                    sectionHTML += `
                        <div class="algo-card">
                            <code>${a}</code>
                        </div>
                    `;
                });
                list.innerHTML += sectionHTML;
            }
        }

        function goBack(viewId) {
            document.querySelectorAll('.container > div').forEach(div => {
                if(div.id !== 'header') div.classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</body>
</html>
